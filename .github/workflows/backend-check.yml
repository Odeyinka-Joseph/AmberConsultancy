name: Backend Diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Apps Script deployment
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbwXVDa29PnfEhkJ12RJ-eE6Hbz-tMUUugcb8YZCvcM0H0oDV6LSwwRK5pdLe2dbOhJ4Sg/exec'

          echo '--- GET redirect chain ---'
          curl -sS -D /tmp/get.headers -o /tmp/get.first "$URL" || true
          sed -n '1,80p' /tmp/get.headers || true
          echo

          echo '--- GET followed ---'
          curl -sS -L -o /tmp/get.txt -w 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\nCONTENT_TYPE=%{content_type}\n' "$URL"
          echo 'TITLE:'
          grep -oiE '<title>[^<]+' /tmp/get.txt | head -5 || true
          echo 'AUTH MARKERS:'
          grep -oiE 'sign in|accounts\.google\.com|authorization|access denied|permission|service unavailable|script function not found' /tmp/get.txt | sort -u | head -20 || true
          echo 'EXPECTED API MARKER:'
          grep -o 'AMBER API' /tmp/get.txt | head -5 || true
          echo

          echo '--- RAW POST health ---'
          curl -sS -L -o /tmp/raw.txt -w 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\nCONTENT_TYPE=%{content_type}\n' -H 'Content-Type: application/json' --data '{"action":"health"}' "$URL"
          echo 'BODY MARKERS:'
          grep -oE '\{"data":\{"ok":true\}\}|AMBER API|sign in|accounts\.google\.com|authorization|permission' /tmp/raw.txt | sort -u | head -20 || true
          echo

          echo '--- BRIDGE POST health ---'
          curl -sS -L -o /tmp/bridge.txt -w 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\nCONTENT_TYPE=%{content_type}\n' --data-urlencode 'payload={"action":"health"}' --data-urlencode 'bridge_nonce=diagnostic-test' "$URL"
          echo 'BRIDGE MARKERS:'
          grep -oE '__amberBridge|diagnostic-test|window\.top\.postMessage|sign in|accounts\.google\.com|authorization|permission' /tmp/bridge.txt | sort -u | head -30 || true
          echo
