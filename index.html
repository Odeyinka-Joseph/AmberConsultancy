<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMBER – Kwara 2027 Phone Poll</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0;background:#f8fafc}header{background:#fff;border-bottom:1px solid #e2e8f0}header img{display:block;width:100%;max-height:330px;object-fit:cover;object-position:center}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 1px 3px #0001;margin-bottom:18px}.login{max-width:430px;margin:48px auto}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;color:#475569;margin:0 0 6px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font:inherit;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px #1d4ed822}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#0f2747;color:#fff}.green{background:#15803d;color:#fff}.soft{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.alert{padding:12px 14px;border-radius:10px;margin:12px 0;background:#fee2e2;border:1px solid #fecaca;color:#991b1b}.ok{padding:12px 14px;border-radius:10px;margin:12px 0;background:#dcfce7;border:1px solid #bbf7d0;color:#166534}.muted{color:#64748b}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;background:#dcfce7;color:#166534}.result{display:flex;justify-content:space-between;gap:14px;align-items:center}.small{font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:10px 8px;font-size:13px}h1,h2,h3{color:#0f2747;margin-top:0}.statusbar{font-size:12px;color:#64748b;margin-top:8px}@media(max-width:700px){.wrap{padding:14px}.row,.row3{grid-template-columns:1fr}.result{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><img id="banner" src="./header.jpg" alt="AMBER Consulting Kwara 2027 Phone Poll Data Capture App"></header>
<main class="wrap"><div id="app"><div class="card">Loading application…</div></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbwXVDa29PnfEhkJ12RJ-eE6Hbz-tMUUugcb8YZCvcM0H0oDV6LSwwRK5pdLe2dbOhJ4Sg/exec';
const LGAS=['Asa','Baruten','Edu','Ekiti','Ifelodun','Ilorin East','Ilorin South','Ilorin West','Irepodun','Isin','Kaiama','Moro','Offa','Oke-Ero','Oyun','Patigi'];
const app=document.getElementById('app');
const banner=document.getElementById('banner');banner.onerror=()=>{if(!banner.src.includes('/public/'))banner.src='./public/header.jpg'};
let token=localStorage.getItem('amber_token')||'';let user=null;let view='poll';let activeContact=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(body){return new Promise((resolve,reject)=>{const nonce=Date.now()+'-'+Math.random().toString(36).slice(2);const iframe=document.createElement('iframe');iframe.name='amber_'+nonce.replace(/\W/g,'');iframe.style.display='none';const form=document.createElement('form');form.method='POST';form.action=API;form.target=iframe.name;form.style.display='none';const payload=document.createElement('input');payload.type='hidden';payload.name='payload';payload.value=JSON.stringify(body);const n=document.createElement('input');n.type='hidden';n.name='bridge_nonce';n.value=nonce;form.append(payload,n);document.body.append(iframe,form);let done=false;const cleanup=()=>{window.removeEventListener('message',onmsg);form.remove();iframe.remove()};const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('Backend did not respond. Confirm the Apps Script web app is deployed as Anyone and uses the AMBER bridge doPost.'))},25000);function onmsg(e){const d=e.data;if(e.source!==iframe.contentWindow||!d||d.__amberBridge!==true||d.nonce!==nonce)return;done=true;clearTimeout(timer);cleanup();if(d.response&&d.response.error)reject(new Error(d.response.error));else resolve(d.response?d.response.data:null)}window.addEventListener('message',onmsg);form.submit()})}
function shell(inner){return `<div class="top"><div><h1>Kwara State 2027 Phone Poll</h1>${user?`<div class="muted">Signed in as ${esc(user.full_name)} · ${esc(user.role)}</div>`:'<div class="muted">AMBER Consulting secure data capture</div>'}</div>${user?`<div class="actions">${user.role==='admin'?`<button class="${view==='poll'?'primary':'soft'}" onclick="showPoll()">Polling</button><button class="${view==='admin'?'primary':'soft'}" onclick="showAdmin()">Admin panel</button>`:''}<button class="soft" onclick="logout()">Sign out</button></div>`:''}</div><div class="statusbar">Backend: ${esc(API)}</div>${inner}`}
function alertBox(msg,ok=false){return `<div class="${ok?'ok':'alert'}">${esc(msg)}</div>`}
function renderLogin(msg=''){user=null;app.innerHTML=shell(`<div class="card login"><h2>Secure Login</h2><p class="muted">Enumerators and administrators use the same sign-in.</p>${msg?alertBox(msg):''}<form id="loginForm"><label>Username</label><input id="username" autocomplete="username" required><div style="height:12px"></div><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div style="height:16px"></div><button id="loginBtn" class="primary" style="width:100%">Sign in</button></form></div>`);document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Signing in…';try{const d=await api({action:'login',username:document.getElementById('username').value.trim(),password:document.getElementById('password').value});token=d.token;user=d.user;localStorage.setItem('amber_token',token);if(user.must_change)renderChangePassword();else showPoll()}catch(err){renderLogin(err.message)} }}
function renderChangePassword(msg=''){app.innerHTML=shell(`<div class="card login"><h2>Change temporary password</h2>${msg?alertBox(msg):''}<label>New password (minimum 8 characters)</label><input id="newpw" type="password"><div style="height:16px"></div><button class="primary" onclick="changePassword()">Save password</button></div>`)}
async function changePassword(){try{const p=document.getElementById('newpw').value;if(p.length<8)throw new Error('Use at least 8 characters.');await api({action:'change_password',token,new_password:p});user.must_change=false;showPoll()}catch(e){renderChangePassword(e.message)}}
function logout(){localStorage.removeItem('amber_token');token='';user=null;renderLogin()}
function showPoll(){view='poll';activeContact=null;app.innerHTML=shell(`<div class="card"><h2>Find respondent</h2><p class="muted small">Enter at least the last 7 digits of the phone number.</p><div class="actions"><input id="searchQ" placeholder="Phone number" style="flex:1;min-width:220px"><button class="primary" onclick="searchContacts()">Search</button></div><div id="searchMsg"></div></div><div id="results"></div>`)}
async function searchContacts(){const q=document.getElementById('searchQ').value;const msg=document.getElementById('searchMsg');msg.innerHTML='Searching…';try{const rows=await api({action:'search',token,q});msg.innerHTML='';const out=document.getElementById('results');out.innerHTML=rows.length?rows.map(c=>`<div class="card result"><div><h3 style="margin-bottom:6px">${esc(c.name)}</h3><div>${esc(c.phone_normalised)}</div><div class="muted small">${esc(c.lga)} · ${esc(c.ward)} · ${esc(c.polling_unit)}</div><div class="small">Status: <b>${esc(c.status)}</b> · Attempts: ${esc(c.attempts||0)}</div></div><button class="green" onclick="startInterview('${esc(c.id)}')">Start interview</button></div>`).join(''):'<div class="card muted">No matching respondent found.</div>'}catch(e){msg.innerHTML=alertBox(e.message)}}
async function startInterview(id){try{const d=await api({action:'start',token,contact_id:id});activeContact=d.contact;renderInterview()}catch(e){document.getElementById('results').innerHTML=alertBox(e.message)}}
function opts(list){return '<option value="">Select…</option>'+list.map(x=>`<option>${esc(x)}</option>`).join('')}
function renderInterview(msg=''){const c=activeContact;if(!c)return showPoll();const basic=['Yes','No',"Don't know / Refused"];app.innerHTML=shell(`<button class="soft" onclick="showPoll()">← Back to search</button><div class="card"><h2>Interview: ${esc(c.name)}</h2><div>${esc(c.phone)} · ${esc(c.lga)} · ${esc(c.ward)} · ${esc(c.polling_unit)}</div></div>${msg?alertBox(msg):''}<form id="survey"><div class="card row"><div><label>Language of interview</label><select name="language">${opts(['English','Yoruba','Hausa','Nupe','Other'])}</select></div><div><label>Respondent reached</label><select name="respondent_reached">${opts(basic)}</select></div><div><label>Consent</label><select name="consent">${opts(basic)}</select></div><div><label>S1 Registration check</label><select name="s1_registration_check">${opts(['I still vote in this location','I now vote somewhere else in Kwara','I no longer vote in Kwara'])}</select></div><div><label>New voting LGA (if applicable)</label><select name="s1_new_lga">${opts(LGAS)}</select></div></div><div class="card row"><div><label>Q1. Rating of Governor AbdulRazaq</label><select name="q1_governor_rating">${opts(['Very good','Good','Fair','Poor','Very poor',"Don't know"])}</select></div><div><label>Q2. Biggest problem in your area</label><select name="q2_biggest_problem">${opts(['Cost of living','Jobs','Security','Roads / infrastructure','Education','Health','Electricity','Water','Other',"Don't know"])}</select></div><div><label>Q3. Governorship vote</label><select name="q3_governor_vote">${opts(['APC','PDP','ADC','SDP','Someone else','Undecided','Will not vote'])}</select></div><div><label>Q4. Is your mind made up?</label><select name="q4_mind_made_up">${opts(['Definitely decided','Could change','Undecided'])}</select></div><div><label>Q5. Which way are you leaning?</label><select name="q5_leaning">${opts(['APC','PDP','ADC','SDP','Someone else','Undecided'])}</select></div><div><label>Q9. Senate vote</label><select name="q9_senate_vote">${opts(['APC','PDP','ADC','SDP','Someone else','Undecided','Will not vote'])}</select></div><div><label>Q10. Same party for governor and senate?</label><select name="q10_same_party">${opts(basic)}</select></div><div><label>Q11. View on zoning</label><select name="q11_zoning">${opts(['Very important','Somewhat important','Not important',"Don't know"])}</select></div><div><label>Q12. 2023 Governor vote</label><select name="q12_2023_vote">${opts(['APC','PDP','Other','Did not vote','Prefer not to say'])}</select></div><div><label>Q13. Likelihood of voting</label><select name="q13_turnout_likelihood">${opts(['Certain to vote','Very likely','Somewhat likely','Unlikely','Will not vote'])}</select></div><div><label>Q14. Do you have a PVC?</label><select name="q14_pvc">${opts(basic)}</select></div><div><label>D1. Religion</label><select name="d1_religion">${opts(['Christianity','Islam','Traditional','Other','Prefer not to say'])}</select></div><div><label>D2. People / tribe</label><select name="d2_tribe">${opts(['Yoruba','Hausa','Fulani','Nupe','Baruba','Other','Prefer not to say'])}</select></div></div><div class="card actions"><button type="button" class="green" onclick="submitSurvey('complete','Completed')">Complete & save</button>${['Refused','Not available','Wrong number','Ineligible'].map(x=>`<button type="button" class="soft" onclick="submitSurvey('terminated','${x}')">${x}</button>`).join('')}</div></form>`)}
async function submitSurvey(status,disposition){try{const fd=new FormData(document.getElementById('survey'));const row=Object.fromEntries(fd.entries());const now=new Date().toISOString();row.id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());row.contact_id=activeContact.id;row.status=status;row.disposition=disposition;row.call_start=window._callStart||now;row.call_end=now;row.skipped_fields=[];await api({action:'submit',token,row});alert('Response saved successfully.');showPoll()}catch(e){renderInterview(e.message)}}
async function showAdmin(){view='admin';app.innerHTML=shell(`<div class="card"><div class="top"><div><h2>Admin panel</h2><p class="muted">Create and manage login credentials for call-centre users.</p></div><span class="pill">Admin username: admin</span></div></div><div id="adminMsg"></div><form id="createUser" class="card"><h3>Create user login</h3><div class="row3"><div><label>Full name</label><input name="full_name" required></div><div><label>Username</label><input name="username" pattern="[A-Za-z0-9._-]+" required></div><div><label>Role</label><select name="role"><option value="enumerator">Enumerator</option><option value="admin">Admin</option></select></div></div><div style="height:14px"></div><button class="green">Create user & temporary password</button></form><div class="card tablewrap"><div class="top"><h3>Users</h3><button class="soft" onclick="loadUsers()">Refresh</button></div><div id="users">Loading…</div></div>`);document.getElementById('createUser').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());try{const d=await api({action:'admin_create_user',token,...f});document.getElementById('adminMsg').innerHTML=alertBox(`User created. Username: ${d.username} | Temporary password: ${d.temporary_password}`,true);e.target.reset();loadUsers()}catch(err){document.getElementById('adminMsg').innerHTML=alertBox(err.message)}};loadUsers()}
async function loadUsers(){const box=document.getElementById('users');if(!box)return;box.textContent='Loading…';try{const rows=await api({action:'admin_list_users',token});box.innerHTML=`<table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Password</th><th>Actions</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?'Active':'Inactive'}</td><td>${u.must_change?'Must change':'Set'}</td><td><button class="soft" onclick="resetPw('${esc(u.username)}')">Reset password</button> <button class="soft" onclick="toggleUser('${esc(u.username)}')">${u.active?'Deactivate':'Reactivate'}</button></td></tr>`).join('')}</tbody></table>`}catch(e){box.innerHTML=alertBox(e.message)}}
async function resetPw(username){if(!confirm('Reset password for '+username+'?'))return;try{const d=await api({action:'admin_reset_password',token,username});document.getElementById('adminMsg').innerHTML=alertBox(`New temporary password for ${username}: ${d.temporary_password}`,true);loadUsers()}catch(e){document.getElementById('adminMsg').innerHTML=alertBox(e.message)}}
async function toggleUser(username){try{await api({action:'admin_toggle_user',token,username});loadUsers()}catch(e){document.getElementById('adminMsg').innerHTML=alertBox(e.message)}}
(async()=>{if(!token)return renderLogin();try{user=await api({action:'me',token});if(user.must_change)renderChangePassword();else showPoll()}catch(e){localStorage.removeItem('amber_token');token='';renderLogin(e.message)}})();
</script>
</body>
</html>
