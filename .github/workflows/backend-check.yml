name: Backend Diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Apps Script GET
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbwXVDa29PnfEhkJ12RJ-eE6Hbz-tMUUugcb8YZCvcM0H0oDV6LSwwRK5pdLe2dbOhJ4Sg/exec'
          echo '--- GET ---'
          code=$(curl -sS -L -o /tmp/get.txt -w '%{http_code}' "$URL")
          echo "HTTP $code"
          head -c 1000 /tmp/get.txt || true
          echo

      - name: Check Apps Script raw POST health
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbwXVDa29PnfEhkJ12RJ-eE6Hbz-tMUUugcb8YZCvcM0H0oDV6LSwwRK5pdLe2dbOhJ4Sg/exec'
          echo '--- RAW POST health ---'
          code=$(curl -sS -L -o /tmp/raw.txt -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"health"}' "$URL")
          echo "HTTP $code"
          head -c 1500 /tmp/raw.txt || true
          echo

      - name: Check Apps Script bridge POST health
        shell: bash
        run: |
          set -e
          URL='https://script.google.com/macros/s/AKfycbwXVDa29PnfEhkJ12RJ-eE6Hbz-tMUUugcb8YZCvcM0H0oDV6LSwwRK5pdLe2dbOhJ4Sg/exec'
          echo '--- BRIDGE POST health ---'
          code=$(curl -sS -L -o /tmp/bridge.txt -w '%{http_code}' --data-urlencode 'payload={"action":"health"}' --data-urlencode 'bridge_nonce=diagnostic-test' "$URL")
          echo "HTTP $code"
          head -c 2000 /tmp/bridge.txt || true
          echo
