<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Create AMBER Admin</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0;background:#f8fafc}.wrap{max-width:560px;margin:42px auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:26px;box-shadow:0 1px 3px #0001}h1{color:#0f2747;margin:0 0 8px}.muted{color:#64748b}.alert{padding:12px 14px;border-radius:10px;margin:14px 0;background:#fee2e2;border:1px solid #fecaca;color:#991b1b}.ok{padding:12px 14px;border-radius:10px;margin:14px 0;background:#dcfce7;border:1px solid #bbf7d0;color:#166534}label{display:block;font-size:13px;font-weight:700;color:#475569;margin:14px 0 6px}input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;font:inherit;outline:none}input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px #1d4ed822}button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:12px 14px;font-weight:800;background:#0f2747;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:#0f2747;font-weight:700;text-decoration:none}
</style>
</head>
<body><main class="wrap"><div class="card"><h1>Create Admin Account</h1><p class="muted">One-time setup for the first AMBER administrator. Choose your own username and password.</p><div id="msg"></div><form id="setupForm"><label>Full name</label><input id="fullName" required autocomplete="name"><label>Admin username</label><input id="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" autocomplete="username"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><label>Confirm password</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"><label>Setup code</label><input id="setupCode" required autocomplete="off"><button id="createBtn">Create admin account</button></form><p style="margin-top:18px"><a href="./">← Back to sign in</a></p></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbwXVDa29PnfEhkJ12RJ-eE6Hbz-tMUUugcb8YZCvcM0H0oDV6LSwwRK5pdLe2dbOhJ4Sg/exec';
const msg=document.getElementById('msg');
function api(body){return new Promise((resolve,reject)=>{const nonce=Date.now()+'-'+Math.random().toString(36).slice(2),iframe=document.createElement('iframe');iframe.name='amber_'+nonce.replace(/\W/g,'');iframe.style.display='none';const form=document.createElement('form');form.method='POST';form.action=API;form.target=iframe.name;form.style.display='none';const payload=document.createElement('input');payload.type='hidden';payload.name='payload';payload.value=JSON.stringify(body);const n=document.createElement('input');n.type='hidden';n.name='bridge_nonce';n.value=nonce;form.append(payload,n);document.body.append(iframe,form);let done=false;const cleanup=()=>{window.removeEventListener('message',onmsg);form.remove();iframe.remove()};const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('The server did not respond.'))},25000);function onmsg(e){const d=e.data;if(!d||d.__amberBridge!==true||d.nonce!==nonce)return;done=true;clearTimeout(timer);cleanup();if(d.response&&d.response.error)reject(new Error(d.response.error));else resolve(d.response?d.response.data:null)}window.addEventListener('message',onmsg);form.submit()})}
document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();msg.innerHTML='';const p=document.getElementById('password').value,cp=document.getElementById('confirmPassword').value;if(p!==cp){msg.innerHTML='<div class="alert">Passwords do not match.</div>';return}const btn=document.getElementById('createBtn');btn.disabled=true;btn.textContent='Creating…';try{const d=await api({action:'bootstrap_admin',full_name:document.getElementById('fullName').value.trim(),username:document.getElementById('username').value.trim(),password:p,setup_code:document.getElementById('setupCode').value.trim()});msg.innerHTML='<div class="ok">Admin account created successfully. You can now sign in.</div>';e.target.reset();btn.textContent='Admin created';setTimeout(()=>location.href='./',1600)}catch(err){msg.innerHTML='<div class="alert">'+String(err.message||'Unable to create admin account.')+'</div>';btn.disabled=false;btn.textContent='Create admin account'}};
</script></body></html>
